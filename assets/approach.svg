 fill="#60a5fa" xml:space="preserve">02 <tspan fill="#e2e8f0">Design</tspan></text><text x="196" y="126" font-size="14" fill="#94a3b8">→ Plan architecture and data flow</text><rect x="32" y="145" width="576" height="30" rx="8" fill="#3b82f6" opacity="0"><animate attributeName="opacity" values="0;0;.25;0;0" keyTimes="0;0.33;0.42;0.5;1" dur="12s" repeatCount="indefinite"/></rect><text x="48" y="166" font-size="15" font-weight="700" fill="#60a5fa" xml:space="preserve">03 <tspan fill="#e2e8f0">Build</tspan></text><text x="196" y="166" font-size="14" fill="#94a3b8">→ Implement in small, testable steps</text><rect x="32" y="185" width="576" height="30" rx="8" fill="#3b82f6" opacity="0"><animate attributeName="opacity" values="0;0;.25;0;0" keyTimes="0;0.5;0.58;0.67;1" dur="12s" repeatCount="indefinite"/></rect><text x="48" y="206" font-size="15" font-weight="700" fill="#60a5fa" xml:space="preserve">04 <tspan fill="#e2e8f0">Audit</tspan></text><text x="196" y="206" font-size="14" fill="#94a3b8">→ Review code, security, and quality</text><rect x="32" y="225" width="576" height="30" rx="8" fill="#3b82f6" opacity="0"><animate attributeName="opacity" values="0;0;.25;0;0" keyTimes="0;0.67;0.75;0.83;1" dur="12s" repeatCount="indefinite"/></rect><text x="48" y="246" font-size="15" font-weight="700" fill="#60a5fa" xml:space="preserve">05 <tspan fill="#e2e8f0">Validate</tspan></text><text x="196" y="246" font-size="14" fill="#94a3b8">→ Verify fixes with evidence</text><rect x="32" y="265" width="576" height="30" rx="8" fill="#3b82f6" opacity="0"><animate attributeName="opacity" values="0;0;.25;0;0" keyTimes="0;0.83;0.92;1;1" dur="12s" repeatCount="indefinite"/></rect><text x="48" y="286" font-size="15" font-weight="700" fill="#60a5fa" xml:space="preserve">06 <tspan fill="#e2e8f0">Improve</tspan></text><text x="196" y="286" font-size="14" fill="#94a3b8">→ Refine and iterate</text></svg>