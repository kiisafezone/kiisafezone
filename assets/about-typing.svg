<text x="400" y="41" text-anchor="middle" font-size="13" fill="#cbd5e1" fill-opacity=".7">about.py — kiisafezone</text>
<text x="52" y="84" font-size="14" fill="#3b82f6" font-weight="700" clip-path="url(#c1)">$ whoami</text>
<text x="52" y="108" font-size="14" fill="#93c5fd" clip-path="url(#c2)">kiisafezone</text>
<text x="52" y="142" font-size="14" fill="#3b82f6" font-weight="700" clip-path="url(#c3)">$ cat about.py</text>
<text x="52" y="170" font-size="14" fill="#e2e8f0" clip-path="url(#c4)"><tspan fill="#60a5fa">class</tspan> <tspan fill="#fbbf24">KiiSafeZone</tspan>:</text>
<text x="68" y="194" font-size="14" fill="#e2e8f0" clip-path="url(#c5)">    focus = [</text>
<text x="68" y="218" font-size="14" fill="#86efac" clip-path="url(#c6)">        "Software engineering &amp; architecture",</text>
<text x="68" y="242" font-size="14" fill="#86efac" clip-path="url(#c7)">        "Application security &amp; vulnerability analysis",</text>
<text x="68" y="266" font-size="14" fill="#86efac" clip-path="url(#c8)">        "Software quality assurance",</text>
<text x="68" y="290" font-size="14" fill="#86efac" clip-path="url(#c9)">        "AI-assisted development &amp; automation",</text>
<text x="68" y="314" font-size="14" fill="#86efac" clip-path="url(#c10)">        "Full-stack and Android development",</text>
<text x="68" y="338" font-size="14" fill="#e2e8f0" clip-path="url(#c11)">    ]</text>
<text x="68" y="362" font-size="14" fill="#e2e8f0" clip-path="url(#c12)">    speaks = [<tspan fill="#86efac">"Indonesian (native)"</tspan>, <tspan fill="#86efac">"English"</tspan>]</text>
<text x="68" y="386" font-size="14" fill="#e2e8f0" clip-path="url(#c13)">    motto = <tspan fill="#86efac">"evidence over assumptions"</tspan></text>
<text x="52" y="422" font-size="14" fill="#64748b" clip-path="url(#c14)">    """</text>
<text x="68" y="446" font-size="14" fill="#cbd5e1" clip-path="url(#c15)">I'm an independent software developer and open-source</text>
<text x="68" y="470" font-size="14" fill="#cbd5e1" clip-path="url(#c16)">creator interested in building practical software,</text>
<text x="68" y="494" font-size="14" fill="#cbd5e1" clip-path="url(#c17)">developing engineering tools, and improving software</text>
<text x="68" y="518" font-size="14" fill="#cbd5e1" clip-path="url(#c18)">quality.</text>
<text x="68" y="542" font-size="14" fill="#cbd5e1" clip-path="url(#c19)">My work sits at the intersection of software engineering,</text>
<text x="68" y="566" font-size="14" fill="#cbd5e1" clip-path="url(#c20)">application security, automation, and modern development</text>
<text x="68" y="590" font-size="14" fill="#cbd5e1" clip-path="url(#c21)">technologies. I believe software should be more than</text>
<text x="68" y="614" font-size="14" fill="#cbd5e1" clip-path="url(#c22)">functional: it should be reliable, maintainable, secure,</text>
<text x="68" y="638" font-size="14" fill="#cbd5e1" clip-path="url(#c23)">and genuinely useful.</text>
<text x="52" y="662" font-size="14" fill="#64748b" clip-path="url(#c24)">    """</text>
<text x="52" y="686" font-size="14" fill="#64748b" clip-path="url(#c25)"># nice to meet you</text>
