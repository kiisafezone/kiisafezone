<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace">
<title>I'm an independent software developer and open-source creator interested in building practical software, developing engineering tools, and improving software quality. My work sits at the intersection of software engineering, application security, automation, and modern development technologies. I believe software should be more than functional: it should be reliable, maintainable, secure, and genuinely useful.</title>
<desc>I'm an independent software developer and open-source creator interested in building practical software, developing engineering tools, and improving software quality. My work sits at the intersection of software engineering, application security, automation, and modern development technologies. I believe software should be more than functional: it should be reliable, maintainable, secure, and genuinely useful.</desc>
