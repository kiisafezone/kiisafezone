<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" font-family="-apple-system, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0f1b4d"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="round">
      <rect width="600" height="620" rx="28"/>
    </clipPath>
  </defs>

  <rect width="600" height="620" rx="28" fill="url(#bg)"/>

  <!-- Wallpaper: bola cahaya melayang -->
  <g clip-path="url(#round)" filter="url(#blur)">
    <circle cx="60" cy="110" r="110" fill="#2563eb" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 40; 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="320" r="120" fill="#6366f1" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -70 30; 0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="520" r="110" fill="#0ea5e9" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" values="0 0; 50 -40; 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="580" r="80" fill="#a855f7" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; -40 -50; 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Menu bar -->
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="600" height="30" fill="#ffffff" fill-opacity="0.14"/>
  </g>
  <line x1="0" y1="30" x2="600" y2="30" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="24" y="20" font-size="13" font-weight="700" fill="#ffffff">Featured Projects</text>
  <text x="576" y="20" font-size="12" fill="#e2e8f0" text-anchor="end">kiisafezone</text>

  <!-- Window 1: UsahaOS -->
  <rect x="24" y="52" width="552" height="150" rx="14" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <path d="M24 88 V66 a14 14 0 0 1 14 -14 H562 a14 14 0 0 1 14 14 V88 Z" fill="#ffffff" fill-opacity="0.12"/>
  <line x1="24" y1="88" x2="576" y2="88" stroke="#ffffff" stroke-opacity="0.18"/>
  <circle cx="44" cy="70" r="6" fill="#ff5f57"/>
  <circle cx="64" cy="70" r="6" fill="#febc2e"/>
  <circle cx="84" cy="70" r="6" fill="#28c840"/>
  <text x="300" y="75" font-size="13" fill="#e2e8f0" fill-opacity="0.85" text-anchor="middle">UsahaOS — Android App</text>
  <rect x="0" y="0" width="100" height="2" fill="url(#sheen)">
    <animateTransform attributeName="transform" type="translate" values="40 53; 460 53" dur="3.5s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="48" y="113" width="64" height="64" rx="16" fill="url(#g1)"/>
  <text x="80" y="155" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">U</text>
  <text x="128" y="130" font-size="22" font-weight="700" fill="#ffffff">UsahaOS</text>
  <text x="128" y="152" font-size="14" fill="#cbd5e1">Android app for Indonesian small businesses (UMKM).</text>
  <rect x="128" y="164" width="77" height="26" rx="13" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="166.5" y="181" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Android</text>
  <rect x="213" y="164" width="54" height="26" rx="13" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="240" y="181" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Room</text>

  <!-- Window 2: LarasHRIS -->
  <rect x="24" y="218" width="552" height="150" rx="14" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <path d="M24 254 V232 a14 14 0 0 1 14 -14 H562 a14 14 0 0 1 14 14 V254 Z" fill="#ffffff" fill-opacity="0.12"/>
  <line x1="24" y1="254" x2="576" y2="254" stroke="#ffffff" stroke-opacity="0.18"/>
  <circle cx="44" cy="236" r="6" fill="#ff5f57"/>
  <circle cx="64" cy="236" r="6" fill="#febc2e"/>
  <circle cx="84" cy="236" r="6" fill="#28c840"/>
  <text x="300" y="241" font-size="13" fill="#e2e8f0" fill-opacity="0.85" text-anchor="middle">LarasHRIS — HR Information System</text>
  <rect x="0" y="0" width="100" height="2" fill="url(#sheen)">
    <animateTransform attributeName="transform" type="translate" values="40 219; 460 219" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="48" y="279" width="64" height="64" rx="16" fill="url(#g2)"/>
  <text x="80" y="321" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>
  <text x="128" y="296" font-size="22" font-weight="700" fill="#ffffff">LarasHRIS</text>
  <text x="128" y="318" font-size="14" fill="#cbd5e1">Integrated Human Resource Information System.</text>
  <rect x="128" y="330" width="77" height="26" rx="13" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="166.5" y="347" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Express</text>
  <rect x="213" y="330" width="99" height="26" rx="13" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="262.5" y="347" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">TypeScript</text>
  <rect x="320" y="330" width="84" height="26" rx="13" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="362" y="347" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Supabase</text>
  <rect x="412" y="330" width="99" height="26" rx="13" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="461.5" y="347" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">PostgreSQL</text>

  <!-- Window 3: RELACHE -->
  <rect x="24" y="384" width="552" height="150" rx="14" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <path d="M24 420 V398 a14 14 0 0 1 14 -14 H562 a14 14 0 0 1 14 14 V420 Z" fill="#ffffff" fill-opacity="0.12"/>
  <line x1="24" y1="420" x2="576" y2="420" stroke="#ffffff" stroke-opacity="0.18"/>
  <circle cx="44" cy="402" r="6" fill="#ff5f57"/>
  <circle cx="64" cy="402" r="6" fill="#febc2e"/>
  <circle cx="84" cy="402" r="6" fill="#28c840"/>
  <text x="300" y="407" font-size="13" fill="#e2e8f0" fill-opacity="0.85" text-anchor="middle">RELÂCHE — Personal Finance</text>
  <rect x="0" y="0" width="100" height="2" fill="url(#sheen)">
    <animateTransform attributeName="transform" type="translate" values="40 385; 460 385" dur="3.5s" begin="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="48" y="445" width="64" height="64" rx="16" fill="url(#g3)"/>
  <text x="80" y="487" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
  <text x="128" y="462" font-size="22" font-weight="700" fill="#ffffff">RELÂCHE</text>
  <text x="128" y="484" font-size="14" fill="#cbd5e1">Indonesia-first personal finance application.</text>
  <rect x="128" y="496" width="144" height="26" rx="13" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="200" y="513" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Personal Finance</text>

  <!-- Dock -->
  <rect x="190" y="552" width="220" height="54" rx="18" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <g>
    <rect x="214" y="559" width="40" height="40" rx="10" fill="url(#g1)"/>
    <text x="234" y="586" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">U</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0; 0 0" keyTimes="0; 0.1; 0.2; 1" dur="4s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="280" y="559" width="40" height="40" rx="10" fill="url(#g2)"/>
    <text x="300" y="586" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0; 0 0" keyTimes="0; 0.1; 0.2; 1" dur="4s" begin="1.3s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="346" y="559" width="40" height="40" rx="10" fill="url(#g3)"/>
    <text x="366" y="586" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0; 0 0" keyTimes="0; 0.1; 0.2; 1" dur="4s" begin="2.6s" repeatCount="indefinite"/>
  </g>
</svg>
