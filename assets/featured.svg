<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <clipPath id="round">
      <rect width="640" height="470" rx="24"/>
    </clipPath>
  </defs>

  <rect width="640" height="470" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#round)" filter="url(#blur)">
    <circle cx="110" cy="70" r="90" fill="#2563eb" opacity="0.6"/>
    <circle cx="540" cy="210" r="110" fill="#7c3aed" opacity="0.5"/>
    <circle cx="190" cy="430" r="100" fill="#06b6d4" opacity="0.4"/>
    <circle cx="570" cy="440" r="80" fill="#2563eb" opacity="0.5"/>
  </g>

  <!-- Card 1: UsahaOS -->
  <rect x="20" y="20" width="600" height="130" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
  <text x="44" y="62" font-size="22" font-weight="700" fill="#ffffff">📱 UsahaOS</text>
  <text x="44" y="90" font-size="14" fill="#cbd5e1">Android app for Indonesian small businesses (UMKM).</text>
  <rect x="44" y="108" width="76" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="82" y="125" font-size="12" fill="#e2e8f0" text-anchor="middle">Android</text>
  <rect x="128" y="108" width="58" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="157" y="125" font-size="12" fill="#e2e8f0" text-anchor="middle">Room</text>

  <!-- Card 2: LarasHRIS -->
  <rect x="20" y="170" width="600" height="130" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
  <text x="44" y="212" font-size="22" font-weight="700" fill="#ffffff">🏢 LarasHRIS</text>
  <text x="44" y="240" font-size="14" fill="#cbd5e1">Integrated Human Resource Information System.</text>
  <rect x="44" y="258" width="76" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="82" y="275" font-size="12" fill="#e2e8f0" text-anchor="middle">Express</text>
  <rect x="128" y="258" width="94" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="175" y="275" font-size="12" fill="#e2e8f0" text-anchor="middle">TypeScript</text>
  <rect x="230" y="258" width="82" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="271" y="275" font-size="12" fill="#e2e8f0" text-anchor="middle">Supabase</text>
  <rect x="320" y="258" width="94" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="367" y="275" font-size="12" fill="#e2e8f0" text-anchor="middle">PostgreSQL</text>

  <!-- Card 3: RELÂCHE -->
  <rect x="20" y="320" width="600" height="130" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
  <text x="44" y="362" font-size="22" font-weight="700" fill="#ffffff">🌿 RELÂCHE</text>
  <text x="44" y="390" font-size="14" fill="#cbd5e1">Indonesia-first personal finance application.</text>
  <rect x="44" y="408" width="139" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="113" y="425" font-size="12" fill="#e2e8f0" text-anchor="middle">Personal Finance</text>
</svg>
