<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="220" viewBox="0 0 1450 220" role="img" aria-labelledby="title desc">
<title id="title">macOS glass technology stack</title>
<desc id="desc">A macOS-inspired glass window containing five technology category cards that scroll continuously from right to left.</desc>
<defs>
  <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#172b49" stop-opacity=".96"/>
    <stop offset=".48" stop-color="#101d33" stop-opacity=".92"/>
    <stop offset="1" stop-color="#241d42" stop-opacity=".96"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".17"/>
    <stop offset=".45" stop-color="#b9d8ff" stop-opacity=".07"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
    <feOffset dy="5"/>
    <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .card{fill:url(#glass);stroke:#dbeafe;stroke-opacity:.24;stroke-width:1}
    .cardshine{fill:url(#shine);opacity:.5}
    .category{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#eaf4ff;letter-spacing:1.15px}
    .tech{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#e1eaf8}
    .hint{font:9px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9eb5d2;letter-spacing:1.3px}
    .windowtitle{font:600 10px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#c5d5ec;letter-spacing:2px}
  </style>
</defs>

<rect x="2" y="2" width="1446" height="216" rx="22" fill="url(#window)" stroke="#dbeafe" stroke-opacity=".24"/>
<circle cx="1260" cy="65" r="90" fill="#60a5fa" opacity=".08"/>
<circle cx="180" cy="180" r="105" fill="#a78bfa" opacity=".08"/>
<path d="M24 2H1426Q1448 2 1448 24V74H2V24Q2 2 24 2Z" fill="#ffffff" opacity=".035"/>
<path d="M24 2H1426" stroke="#ffffff" stroke-opacity=".28"/>
<circle cx="28" cy="28" r="6" fill="#ff5f57"/>
<circle cx="49" cy="28" r="6" fill="#febc2e"/>
<circle cx="70" cy="28" r="6" fill="#28c840"/>
<text x="725" y="32" text-anchor="middle" class="windowtitle">TECHNOLOGY / STACK</text>
<path d="M2 74H1448" stroke="#dbeafe" stroke-opacity=".16"/>

<g transform="translate(0 0)">
  <g transform="translate(20 86)" filter="url(#shadow)">
    <rect class="card" width="258" height="112" rx="16"/>
    <path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/>
    <rect x="18" y="17" width="4" height="22" rx="2" fill="#7dd3fc"/>
    <text x="32" y="32" class="category">MOBILE STACK</text>
    <text x="18" y="67" class="tech">Kotlin · Android Studio</text>
    <text x="18" y="86" class="tech">Flutter · Dart</text>
    <text x="18" y="104" class="hint">APP DEVELOPMENT</text>
  </g>
  <g transform="translate(298 86)" filter="url(#shadow)">
    <rect class="card" width="258" height="112" rx="16"/>
    <path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/>
    <rect x="18" y="17" width="4" height="22" rx="2" fill="#6ee7b7"/>
    <text x="32" y="32" class="category">WEB STACK</text>
    <text x="18" y="67" class="tech">HTML · CSS · JavaScript</text>
    <text x="18" y="86" class="tech">TypeScript · React</text>
    <text x="18" y="104" class="hint">WEB DEVELOPMENT</text>
  </g>
  <g transform="translate(576 86)" filter="url(#shadow)">
    <rect class="card" width="258" height="112" rx="16"/>
    <path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/>
    <rect x="18" y="17" width="4" height="22" rx="2" fill="#c4b5fd"/>
    <text x="32" y="32" class="category">BACKEND STACK</text>
    <text x="18" y="67" class="tech">Python · Flask</text>
    <text x="18" y="86" class="tech">Node.js · Express</text>
    <text x="18" y="104" class="hint">SERVER DEVELOPMENT</text>
  </g>
  <g transform="translate(854 86)" filter="url(#shadow)">
    <rect class="card" width="258" height="112" rx="16"/>
    <path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/>
    <rect x="18" y="17" width="4" height="22" rx="2" fill="#fcd34d"/>
    <text x="32" y="32" class="category">DATA STACK</text>
    <text x="18" y="67" class="tech">PostgreSQL</text>
    <text x="18" y="86" class="tech">Supabase</text>
    <text x="18" y="104" class="hint">DATABASE &amp; STORAGE</text>
  </g>
  <g transform="translate(1132 86)" filter="url(#shadow)">
    <rect class="card" width="258" height="112" rx="16"/>
    <path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/>
    <rect x="18" y="17" width="4" height="22" rx="2" fill="#fda4af"/>
    <text x="32" y="32" class="category">INFRA STACK</text>
    <text x="18" y="67" class="tech">Docker · Cloudflare · Vercel</text>
    <text x="18" y="86" class="tech">Git · GitHub · Linux</text>
    <text x="18" y="104" class="hint">TOOLS &amp; INFRASTRUCTURE</text>
  </g>
  <g transform="translate(1450 0)">
    <g transform="translate(20 86)"><rect class="card" width="258" height="112" rx="16"/><path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/><rect x="18" y="17" width="4" height="22" rx="2" fill="#7dd3fc"/><text x="32" y="32" class="category">MOBILE STACK</text><text x="18" y="67" class="tech">Kotlin · Android Studio</text><text x="18" y="86" class="tech">Flutter · Dart</text><text x="18" y="104" class="hint">APP DEVELOPMENT</text></g>
    <g transform="translate(298 86)"><rect class="card" width="258" height="112" rx="16"/><path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/><rect x="18" y="17" width="4" height="22" rx="2" fill="#6ee7b7"/><text x="32" y="32" class="category">WEB STACK</text><text x="18" y="67" class="tech">HTML · CSS · JavaScript</text><text x="18" y="86" class="tech">TypeScript · React</text><text x="18" y="104" class="hint">WEB DEVELOPMENT</text></g>
    <g transform="translate(576 86)"><rect class="card" width="258" height="112" rx="16"/><path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/><rect x="18" y="17" width="4" height="22" rx="2" fill="#c4b5fd"/><text x="32" y="32" class="category">BACKEND STACK</text><text x="18" y="67" class="tech">Python · Flask</text><text x="18" y="86" class="tech">Node.js · Express</text><text x="18" y="104" class="hint">SERVER DEVELOPMENT</text></g>
    <g transform="translate(854 86)"><rect class="card" width="258" height="112" rx="16"/><path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/><rect x="18" y="17" width="4" height="22" rx="2" fill="#fcd34d"/><text x="32" y="32" class="category">DATA STACK</text><text x="18" y="67" class="tech">PostgreSQL</text><text x="18" y="86" class="tech">Supabase</text><text x="18" y="104" class="hint">DATABASE &amp; STORAGE</text></g>
    <g transform="translate(1132 86)"><rect class="card" width="258" height="112" rx="16"/><path class="cardshine" d="M16 1H242Q257 1 257 16V42H1V16Q1 1 16 1Z"/><rect x="18" y="17" width="4" height="22" rx="2" fill="#fda4af"/><text x="32" y="32" class="category">INFRA STACK</text><text x="18" y="67" class="tech">Docker · Cloudflare · Vercel</text><text x="18" y="86" class="tech">Git · GitHub · Linux</text><text x="18" y="104" class="hint">TOOLS &amp; INFRASTRUCTURE</text></g>
  </g>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-1450 0" dur="38s" repeatCount="indefinite"/>
</g>
</svg>