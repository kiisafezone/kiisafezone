<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="160" viewBox="0 0 1450 160" role="img" aria-labelledby="title desc">
<title id="title">Animated technology stack</title>
<desc id="desc">Five self-contained technology category cards scroll continuously from right to left. The actual technology logos are displayed directly in the README below.</desc>
<defs>
  <style>
    .card{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
    .badge{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff;letter-spacing:.5px}
    .tech{font:11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#c9d1d9}
    .hint{font:9px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8b949e}
  </style>
</defs>
<rect width="1450" height="160" rx="14" fill="#0d1117"/>
<g>
  <g transform="translate(0 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="92" height="23" rx="6" fill="#3b82f6"/><text x="31" y="32" class="badge">MOBILE STACK</text><text x="20" y="76" class="tech">Kotlin · Android Studio</text><text x="20" y="98" class="tech">Flutter · Dart</text><text x="20" y="122" class="hint">APP DEVELOPMENT</text></g>
  <g transform="translate(290 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="82" height="23" rx="6" fill="#10b981"/><text x="31" y="32" class="badge">WEB STACK</text><text x="20" y="76" class="tech">HTML · CSS · JavaScript</text><text x="20" y="98" class="tech">TypeScript · React</text><text x="20" y="122" class="hint">WEB DEVELOPMENT</text></g>
  <g transform="translate(580 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="112" height="23" rx="6" fill="#8b5cf6"/><text x="31" y="32" class="badge">BACKEND STACK</text><text x="20" y="76" class="tech">Python · Flask</text><text x="20" y="98" class="tech">Node.js · Express</text><text x="20" y="122" class="hint">SERVER DEVELOPMENT</text></g>
  <g transform="translate(870 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="88" height="23" rx="6" fill="#f59e0b"/><text x="31" y="32" class="badge">DATA STACK</text><text x="20" y="76" class="tech">PostgreSQL</text><text x="20" y="98" class="tech">Supabase</text><text x="20" y="122" class="hint">DATABASE &amp; STORAGE</text></g>
  <g transform="translate(1160 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="92" height="23" rx="6" fill="#ef4444"/><text x="31" y="32" class="badge">INFRA STACK</text><text x="20" y="76" class="tech">Docker · Cloudflare · Vercel</text><text x="20" y="98" class="tech">Git · GitHub · Linux</text><text x="20" y="122" class="hint">TOOLS &amp; INFRASTRUCTURE</text></g>
  <g transform="translate(1450 0)">
    <g transform="translate(0 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="92" height="23" rx="6" fill="#3b82f6"/><text x="31" y="32" class="badge">MOBILE STACK</text><text x="20" y="76" class="tech">Kotlin · Android Studio</text><text x="20" y="98" class="tech">Flutter · Dart</text><text x="20" y="122" class="hint">APP DEVELOPMENT</text></g>
    <g transform="translate(290 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="82" height="23" rx="6" fill="#10b981"/><text x="31" y="32" class="badge">WEB STACK</text><text x="20" y="76" class="tech">HTML · CSS · JavaScript</text><text x="20" y="98" class="tech">TypeScript · React</text><text x="20" y="122" class="hint">WEB DEVELOPMENT</text></g>
    <g transform="translate(580 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="112" height="23" rx="6" fill="#8b5cf6"/><text x="31" y="32" class="badge">BACKEND STACK</text><text x="20" y="76" class="tech">Python · Flask</text><text x="20" y="98" class="tech">Node.js · Express</text><text x="20" y="122" class="hint">SERVER DEVELOPMENT</text></g>
    <g transform="translate(870 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="88" height="23" rx="6" fill="#f59e0b"/><text x="31" y="32" class="badge">DATA STACK</text><text x="20" y="76" class="tech">PostgreSQL</text><text x="20" y="98" class="tech">Supabase</text><text x="20" y="122" class="hint">DATABASE &amp; STORAGE</text></g>
    <g transform="translate(1160 10)"><rect class="card" width="260" height="140" rx="12"/><rect x="20" y="16" width="92" height="23" rx="6" fill="#ef4444"/><text x="31" y="32" class="badge">INFRA STACK</text><text x="20" y="76" class="tech">Docker · Cloudflare · Vercel</text><text x="20" y="98" class="tech">Git · GitHub · Linux</text><text x="20" y="122" class="hint">TOOLS &amp; INFRASTRUCTURE</text></g>
  </g>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-1450 0" dur="32s" repeatCount="indefinite"/>
</g>
</svg>