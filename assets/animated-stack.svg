<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1450 200" role="img" aria-labelledby="title desc">
<title id="title">macOS glass technology stack</title>
<desc id="desc">Five macOS-inspired glass technology cards appear individually from left to right with a staggered slide-up fade-in animation.</desc>
<defs>
  <linearGradient id="macBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/>
    <stop offset=".5" stop-color="#0a1740"/>
    <stop offset="1" stop-color="#172554"/>
  </linearGradient>
  <linearGradient id="glassBorder" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
    <stop offset=".42" stop-color="#fff" stop-opacity=".08"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity=".34"/>
  </linearGradient>
  <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".035"/>
  </linearGradient>
  <linearGradient id="glassShine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="orbBlur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
  <filter id="cardShadow" x="-15%" y="-20%" width="130%" height="150%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".38"/>
  </filter>
  <style>
    .stack-card {
      opacity: 0;
      animation: cardReveal .85s cubic-bezier(.16,1,.3,1) forwards;
    }
    .card-1 { animation-delay: .12s; }
    .card-2 { animation-delay: .30s; }
    .card-3 { animation-delay: .48s; }
    .card-4 { animation-delay: .66s; }
    .card-5 { animation-delay: .84s; }
    .category {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.15px;
      fill: #eaf2ff;
    }
    .tech {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #f1f5ff;
    }
    .hint {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 9px;
      letter-spacing: 1.15px;
      fill: #a9bddb;
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(20px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</defs>

<rect x="2" y="2" width="1446" height="196" rx="20" fill="url(#macBg)" stroke="#dbeafe" stroke-opacity=".22"/>
<circle cx="155" cy="155" r="72" fill="#3b82f6" opacity=".38" filter="url(#orbBlur)"/>
<circle cx="650" cy="35" r="78" fill="#7c3aed" opacity=".28" filter="url(#orbBlur)"/>
<circle cx="1280" cy="145" r="75" fill="#ec4899" opacity=".22" filter="url(#orbBlur)"/>
<path d="M22 2H1428Q1448 2 1448 22V48H2V22Q2 2 22 2Z" fill="#fff" opacity=".035"/>
<path d="M22 2H1428" stroke="#fff" stroke-opacity=".24"/>

<g class="stack-card card-1" transform="translate(30 30)" filter="url(#cardShadow)">
  <rect width="260" height="140" rx="16" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.2"/>
  <path d="M16 1H244Q259 1 259 16V42H1V16Q1 1 16 1Z" fill="url(#glassShine)" opacity=".7"/>
  <circle cx="20" cy="20" r="4.5" fill="#ff5f57"/>
  <circle cx="35" cy="20" r="4.5" fill="#febc2e"/>
  <circle cx="50" cy="20" r="4.5" fill="#28c840"/>
  <text class="category" x="20" y="58" fill="#7dd3fc">MOBILE STACK</text>
  <rect x="220" y="49" width="18" height="25" rx="5" fill="#7dd3fc" opacity=".85"/>
  <text class="tech" x="20" y="91">Kotlin · Android Studio</text>
  <text class="tech" x="20" y="111">Flutter · Dart</text>
  <text class="hint" x="20" y="130">APP DEVELOPMENT</text>
</g>

<g class="stack-card card-2" transform="translate(310 30)" filter="url(#cardShadow)">
  <rect width="260" height="140" rx="16" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.2"/>
  <path d="M16 1H244Q259 1 259 16V42H1V16Q1 1 16 1Z" fill="url(#glassShine)" opacity=".7"/>
  <circle cx="20" cy="20" r="4.5" fill="#ff5f57"/>
  <circle cx="35" cy="20" r="4.5" fill="#febc2e"/>
  <circle cx="50" cy="20" r="4.5" fill="#28c840"/>
  <text class="category" x="20" y="58" fill="#6ee7b7">WEB STACK</text>
  <path d="M220 50h20v13h-20zM224 66h12v2h-12z" fill="#6ee7b7" opacity=".9"/>
  <text class="tech" x="20" y="91">HTML · CSS · JavaScript</text>
  <text class="tech" x="20" y="111">TypeScript · React</text>
  <text class="hint" x="20" y="130">WEB DEVELOPMENT</text>
</g>

<g class="stack-card card-3" transform="translate(590 30)" filter="url(#cardShadow)">
  <rect width="260" height="140" rx="16" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.2"/>
  <path d="M16 1H244Q259 1 259 16V42H1V16Q1 1 16 1Z" fill="url(#glassShine)" opacity=".7"/>
  <circle cx="20" cy="20" r="4.5" fill="#ff5f57"/>
  <circle cx="35" cy="20" r="4.5" fill="#febc2e"/>
  <circle cx="50" cy="20" r="4.5" fill="#28c840"/>
  <text class="category" x="20" y="58" fill="#c4b5fd">BACKEND STACK</text>
  <path d="M218 50h20v5h-20zM218 59h20v5h-20z" fill="#c4b5fd" opacity=".9"/>
  <text class="tech" x="20" y="91">Python · Flask</text>
  <text class="tech" x="20" y="111">Node.js · Express</text>
  <text class="hint" x="20" y="130">SERVER DEVELOPMENT</text>
</g>

<g class="stack-card card-4" transform="translate(870 30)" filter="url(#cardShadow)">
  <rect width="260" height="140" rx="16" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.2"/>
  <path d="M16 1H244Q259 1 259 16V42H1V16Q1 1 16 1Z" fill="url(#glassShine)" opacity=".7"/>
  <circle cx="20" cy="20" r="4.5" fill="#ff5f57"/>
  <circle cx="35" cy="20" r="4.5" fill="#febc2e"/>
  <circle cx="50" cy="20" r="4.5" fill="#28c840"/>
  <text class="category" x="20" y="58" fill="#fcd34d">DATA STACK</text>
  <path d="M220 50c5 0 8 1 8 3s-3 3-8 3-8-1-8-3 3-3 8-3zm-8 7v8c0 2 3 3 8 3s8-1 8-3v-8c-2 2-5 2-8 2s-6 0-8-2z" fill="#fcd34d" opacity=".9"/>
  <text class="tech" x="20" y="91">PostgreSQL</text>
  <text class="tech" x="20" y="111">Supabase</text>
  <text class="hint" x="20" y="130">DATABASE &amp; STORAGE</text>
</g>

<g class="stack-card card-5" transform="translate(1150 30)" filter="url(#cardShadow)">
  <rect width="260" height="140" rx="16" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.2"/>
  <path d="M16 1H244Q259 1 259 16V42H1V16Q1 1 16 1Z" fill="url(#glassShine)" opacity=".7"/>
  <circle cx="20" cy="20" r="4.5" fill="#ff5f57"/>
  <circle cx="35" cy="20" r="4.5" fill="#febc2e"/>
  <circle cx="50" cy="20" r="4.5" fill="#28c840"/>
  <text class="category" x="20" y="58" fill="#fda4af">INFRA STACK</text>
  <path d="M223 55a4 4 0 0 0-7-2 4 4 0 0 0-5 4 4 4 0 0 0 4 4h10a4 4 0 0 0-2-6z" fill="#fda4af" opacity=".9"/>
  <text class="tech" x="20" y="91">Docker · Cloudflare · Vercel</text>
  <text class="tech" x="20" y="111">Git · GitHub · Linux</text>
  <text class="hint" x="20" y="130">TOOLS &amp; INFRASTRUCTURE</text>
</g>
</svg>